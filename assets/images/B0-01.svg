<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="Helvetica, Arial, sans-serif">
  <title>How a wrist PPG sensor works, and where its signal goes wrong</title>
  <rect width="1000" height="520" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2933">How a wrist PPG sensor works, and where its signal goes wrong</text>
  <!-- sensor -->
  <rect x="330" y="80" width="340" height="70" rx="8" fill="#2d3748"/>
  <text x="500" y="108" text-anchor="middle" font-size="14" fill="#fff">heart-rate sensor (pressed against the skin)</text>
  <rect x="380" y="125" width="60" height="25" rx="4" fill="#e53e3e"/><text x="410" y="142" text-anchor="middle" font-size="12" fill="#fff">LED</text>
  <rect x="560" y="125" width="70" height="25" rx="4" fill="#4a5568" stroke="#cbd5e0"/><text x="595" y="142" text-anchor="middle" font-size="12" fill="#fff">photodiode</text>
  <!-- skin + tissue -->
  <path d="M60 150 L940 150 L940 470 L60 470 Z" fill="#f8d7c4"/>
  <line x1="60" y1="150" x2="940" y2="150" stroke="#b7795a" stroke-width="3"/>
  <text x="70" y="175" font-size="13" fill="#7b4a33">skin</text>
  <text x="70" y="300" font-size="13" fill="#7b4a33">tissue</text>
  <!-- blood vessel -->
  <ellipse cx="500" cy="360" rx="360" ry="32" fill="#c53030" opacity="0.85"/>
  <ellipse cx="500" cy="360" rx="360" ry="44" fill="none" stroke="#c53030" stroke-dasharray="6 5"/>
  <text x="500" y="365" text-anchor="middle" font-size="13" fill="#fff">blood vessel: widens slightly with each heartbeat</text>
  <!-- light path -->
  <defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#dd6b20"/></marker>
        <marker id="rr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#c53030"/></marker></defs>
  <polyline points="410,152 450,250 500,300 550,250 595,155" fill="none" stroke="#dd6b20" stroke-width="3" marker-end="url(#ar)"/>
  <text x="620" y="215" font-size="13" fill="#9c4221">returning light varies slightly</text>
  <text x="620" y="232" font-size="13" fill="#9c4221">with each heartbeat</text>
  <!-- error sources -->
  <g font-size="13" fill="#c53030">
    <line x1="230" y1="70" x2="325" y2="140" stroke="#c53030" stroke-width="2" marker-end="url(#rr)"/>
    <text x="70" y="60">1. ambient light leaking in</text><text x="70" y="76">   at a loose edge</text>
    <line x1="760" y1="120" x2="680" y2="120" stroke="#c53030" stroke-width="2" marker-end="url(#rr)"/>
    <line x1="760" y1="120" x2="840" y2="120" stroke="#c53030" stroke-width="2" marker-end="url(#rr)"/>
    <text x="700" y="78">2. sensor sliding over the</text><text x="700" y="94">   skin as the wrist moves</text>
    <text x="70" y="430">3. arm swing at the same rate as a heartbeat looks like a pulse (signal crossover)</text>
  </g>
</svg>

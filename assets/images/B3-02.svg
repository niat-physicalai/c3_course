<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 560" font-family="Helvetica, Arial, sans-serif">
  <title>XIAO ESP32-C3 pin map with esp_watch's allocation</title>
  <rect width="1060" height="560" fill="#ffffff"/>
  <text x="530" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2933">XIAO ESP32-C3: esp_watch's pin allocation (top view)</text>
  <g transform="translate(100,0)">
  <!-- board -->
  <rect x="330" y="80" width="200" height="330" rx="18" fill="#2f4f4f" stroke="#1f2933" stroke-width="2"/>
  <rect x="395" y="64" width="70" height="34" rx="8" fill="#b0b7bf" stroke="#1f2933" stroke-width="2"/>
  <text x="430" y="86" text-anchor="middle" font-size="13" fill="#1f2933">USB-C</text>
  <text x="430" y="250" text-anchor="middle" font-size="15" fill="#ffffff">XIAO</text>
  <text x="430" y="270" text-anchor="middle" font-size="15" fill="#ffffff">ESP32-C3</text>
  <!-- pins: left D0..D6, right 5V GND 3V3 D10 D9 D8 D7 -->
  <g font-size="14">
    <!-- left side -->
    <g>
      <circle cx="342" cy="120" r="9" fill="#f4b740" stroke="#1f2933"/><text x="320" y="125" text-anchor="end" fill="#1f2933">D0 · GPIO2 · <tspan fill="#8a8f96">not connected</tspan>  <tspan font-weight="bold" fill="#b7791f">strapping</tspan>  <tspan font-weight="bold" fill="#2b6cb0">A</tspan></text>
      <circle cx="342" cy="165" r="9" fill="#38a169" stroke="#1f2933"/><text x="320" y="170" text-anchor="end" fill="#1f2933">D1 · GPIO3 · <tspan font-weight="bold">"previous" button</tspan>  <tspan font-weight="bold" fill="#2b6cb0">A</tspan></text>
      <circle cx="342" cy="210" r="9" fill="#cbd2d9" stroke="#1f2933"/><text x="320" y="215" text-anchor="end" fill="#1f2933">D2 · GPIO4 · <tspan fill="#8a8f96">not connected</tspan>  <tspan font-weight="bold" fill="#2b6cb0">A</tspan></text>
      <circle cx="342" cy="255" r="9" fill="#cbd2d9" stroke="#1f2933"/><text x="320" y="260" text-anchor="end" fill="#1f2933">D3 · GPIO5 · <tspan fill="#8a8f96">not connected</tspan></text>
      <circle cx="342" cy="300" r="9" fill="#3182ce" stroke="#1f2933"/><text x="320" y="305" text-anchor="end" fill="#1f2933">D4 · GPIO6 · <tspan font-weight="bold">I²C SDA</tspan></text>
      <circle cx="342" cy="345" r="9" fill="#3182ce" stroke="#1f2933"/><text x="320" y="350" text-anchor="end" fill="#1f2933">D5 · GPIO7 · <tspan font-weight="bold">I²C SCL</tspan></text>
      <circle cx="342" cy="390" r="9" fill="#cbd2d9" stroke="#1f2933"/><text x="320" y="395" text-anchor="end" fill="#1f2933">D6 · GPIO21 · <tspan fill="#8a8f96">UART TX, left free for debugging</tspan></text>
    </g>
    <!-- right side -->
    <g>
      <circle cx="518" cy="120" r="9" fill="#e53e3e" stroke="#1f2933"/><text x="540" y="125" fill="#1f2933">5V</text>
      <circle cx="518" cy="165" r="9" fill="#1f2933" stroke="#1f2933"/><text x="540" y="170" fill="#1f2933">GND</text>
      <circle cx="518" cy="210" r="9" fill="#e53e3e" stroke="#1f2933"/><text x="540" y="215" fill="#1f2933">3V3 · <tspan font-weight="bold">3.3 V rail to all modules</tspan></text>
      <circle cx="518" cy="255" r="9" fill="#38a169" stroke="#1f2933"/><text x="540" y="260" fill="#1f2933">D10 · GPIO10 · <tspan font-weight="bold">"next" button</tspan></text>
      <circle cx="518" cy="300" r="9" fill="#f4b740" stroke="#1f2933"/><text x="540" y="305" fill="#1f2933">D9 · GPIO9 · <tspan fill="#8a8f96">not connected (boot button)</tspan>  <tspan font-weight="bold" fill="#b7791f">strapping</tspan></text>
      <circle cx="518" cy="345" r="9" fill="#f4b740" stroke="#1f2933"/><text x="540" y="350" fill="#1f2933">D8 · GPIO8 · <tspan fill="#8a8f96">not connected</tspan>  <tspan font-weight="bold" fill="#b7791f">strapping</tspan></text>
      <circle cx="518" cy="390" r="9" fill="#cbd2d9" stroke="#1f2933"/><text x="540" y="395" fill="#1f2933">D7 · GPIO20 · <tspan fill="#8a8f96">UART RX, left free</tspan></text>
    </g>
  </g>
  <!-- BAT inset -->
  <rect x="360" y="425" width="140" height="44" rx="6" fill="none" stroke="#1f2933" stroke-dasharray="6 4"/>
  <text x="430" y="445" text-anchor="middle" font-size="13" fill="#1f2933">underside: BAT+ / BAT−</text>
  <text x="430" y="461" text-anchor="middle" font-size="12" fill="#5c6670">protected LiPo via SW3</text>
  </g>
  <!-- legend -->
  <g font-size="13" fill="#1f2933">
    <circle cx="60" cy="500" r="8" fill="#3182ce" stroke="#1f2933"/><text x="74" y="505">I²C bus</text>
    <circle cx="160" cy="500" r="8" fill="#38a169" stroke="#1f2933"/><text x="174" y="505">button (to GND, internal pull-up)</text>
    <circle cx="420" cy="500" r="8" fill="#f4b740" stroke="#1f2933"/><text x="434" y="505">strapping pin: must be high at reset</text>
    <circle cx="700" cy="500" r="8" fill="#cbd2d9" stroke="#1f2933"/><text x="714" y="505">unused</text>
    <text x="60" y="535"><tspan font-weight="bold" fill="#2b6cb0">A</tspan> = ADC1 pin (GPIO0–GPIO4), the right choice for an analog input such as a battery divider</text>
  </g>
</svg>

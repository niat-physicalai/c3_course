<text x="200.0" y="150" font-family="Montserrat, Arial, sans-serif" font-size="36" font-weight="700" fill="white" text-anchor="middle" dominant-baseline="middle">Decision</text>
<rect x="350" y="70" width="780" height="160" rx="14" fill="white" stroke="#C9DCEA" stroke-width="3"/>
<text x="740.0" y="150" font-family="Montserrat, Arial, sans-serif" font-size="30" font-weight="600" fill="#263238" text-anchor="middle" dominant-baseline="middle">WiFi only once, at first boot</text>
<rect x="70" y="270" width="260" height="160" rx="14" fill="#6B7680" stroke="#6B7680" stroke-width="3"/>
<text x="200.0" y="350" font-family="Montserrat, Arial, sans-serif" font-size="36" font-weight="700" fill="white" text-anchor="middle" dominant-baseline="middle">Options</text>
<rect x="350" y="270" width="780" height="160" rx="14" fill="white" stroke="#C9DCEA" stroke-width="3"/>
<text x="740.0" y="350" font-family="Montserrat, Arial, sans-serif" font-size="30" font-weight="600" fill="#263238" text-anchor="middle" dominant-baseline="middle">always on · BLE to a phone app · once at boot</text>
<rect x="70" y="470" width="260" height="160" rx="14" fill="#2E9E5B" stroke="#2E9E5B" stroke-width="3"/>
<text x="200.0" y="550" font-family="Montserrat, Arial, sans-serif" font-size="36" font-weight="700" fill="white" text-anchor="middle" dominant-baseline="middle">Why</text>

<text x="740.0" y="550" font-family="Montserrat, Arial, sans-serif" font-size="30" font-weight="600" fill="#263238" text-anchor="middle" dominant-baseline="middle">battery is dominated by what runs all day</text>
<rect x="70" y="670" width="260" height="160" rx="14" fill="#E07B1A" stroke="#E07B1A" stroke-width="3"/>
<text x="200.0" y="750" font-family="Montserrat, Arial, sans-serif" font-size="36" font-weight="700" fill="white" text-anchor="middle" dominant-baseline="middle">Costs</text>

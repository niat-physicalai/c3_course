<text x="885" y="150" font-family="Montserrat, Arial, sans-serif" font-size="42" font-weight="700" fill="#D64545" text-anchor="middle" dominant-baseline="middle">Chest strap</text>
<text x="885" y="268" font-family="Montserrat, Arial, sans-serif" font-size="36" font-weight="600" fill="#263238" text-anchor="middle" dominant-baseline="middle">Rejected:</text>

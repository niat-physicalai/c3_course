<text x="315" y="268" font-family="Montserrat, Arial, sans-serif" font-size="36" font-weight="600" fill="#263238" text-anchor="middle" dominant-baseline="middle">Rejected: needs a</text>
<text x="315" y="312" font-family="Montserrat, Arial, sans-serif" font-size="36" font-weight="600" fill="#263238" text-anchor="middle" dominant-baseline="middle">deliberate action</text>

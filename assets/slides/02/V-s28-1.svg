<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" width="1600" height="720">
<rect width="1600" height="720" fill="white"/>
<text x="30" y="50" font-family="Montserrat, Arial, sans-serif" font-size="30" font-weight="700" fill="#263238" text-anchor="start" dominant-baseline="middle">1 · Write the register number</text>
<rect x="30" y="80" width="190" height="110" rx="10" fill="#263238" stroke="#263238" stroke-width="3"/>
<text x="125.0" y="135" font-family="Montserrat, Arial, sans-serif" font-size="28" font-weight="700" fill="white" text-anchor="middle" dominant-baseline="middle">START</text>
<text x="125.0" y="230" font-family="Montserrat, Arial, sans-serif" font-size="25" font-weight="600" fill="#6B7680" text-anchor="middle" dominant-baseline="middle">SDA falls,</text>
<text x="125.0" y="260" font-family="Montserrat, Arial, sans-serif" font-size="25" font-weight="600" fill="#6B7680" text-anchor="middle" dominant-baseline="middle">SCL high</text>
<rect x="234" y="80" width="270" height="110" rx="10" fill="#006DAF" stroke="#006DAF" stroke-width="3"/>
<text x="369.0" y="135" font-family="Montserrat, Arial, sans-serif" font-size="28" font-weight="700" fill="white" text-anchor="middle" dominant-baseline="middle">0x68 + W</text>
<text x="369.0" y="230" font-family="Montserrat, Arial, sans-serif" font-size="25" font-weight="600" fill="#6B7680" text-anchor="middle" dominant-baseline="middle">address,</text>
<text x="369.0" y="260" font-family="Montserrat, Arial, sans-serif" font-size="25" font-weight="600" fill="#6B7680" text-anchor="middle" dominant-baseline="middle">write bit 0</text>
<rect x="518" y="80" width="150" height="110" rx="10" fill="#E7F6EC" stroke="#2E9E5B" stroke-width="3"/>
<text x="593.0" y="135" font-family="Montserrat, Arial, sans-serif" font-size="28" font-weight="700" fill="#2E9E5B" text-anchor="middle" dominant-baseline="middle">ACK</text>
<text x="593.0" y="230" font-family="Montserrat, Arial, sans-serif" font-size="25" font-weight="600" fill="#6B7680" text-anchor="middle" dominant-baseline="middle">sensor:</text>
<text x="593.0" y="260" font-family="Montserrat, Arial, sans-serif" font-size="25" font-weight="600" fill="#6B7680" text-anchor="middle" dominant-baseline="middle">“that's me”</text>
<rect x="682" y="80" width="270" height="110" rx="10" fill="#E8F4FB" stroke="#006DAF" stroke-width="3"/>
<text x="817.0" y="135" font-family="Montserrat, Arial, sans-serif" font-size="28" font-weight="700" fill="#263238" text-anchor="middle" dominant-baseline="middle">0x3B</text>
<text x="817.0" y="230" font-family="Montserrat, Arial, sans-serif" font-size="25" font-weight="600" fill="#6B7680" text-anchor="middle" dominant-baseline="middle">first acceleration</text>
<text x="817.0" y="260" font-family="Montserrat, Arial, sans-serif" font-size="25" font-weight="600" fill="#6B7680" text-anchor="middle" dominant-baseline="middle">register</text>
<rect x="966" y="80" width="150" height="110" rx="10" fill="#E7F6EC" stroke="#2E9E5B" stroke-width="3"/>
<text x="1041.0" y="135" font-family="Montserrat, Arial, sans-serif" font-size="28" font-weight="700" fill="#2E9E5B" text-anchor="middle" dominant-baseline="middle">ACK</text>
<text x="1041.0" y="245" font-family="Montserrat, Arial, sans-serif" font-size="25" font-weight="600" fill="#6B7680" text-anchor="middle" dominant-baseline="middle"></text>
<text x="30" y="410" font-family="Montserrat, Arial, sans-serif" font-size="30" font-weight="700" fill="#263238" text-anchor="start" dominant-baseline="middle">2 · Read 14 bytes</text>
<rect x="30" y="440" width="190" height="110" rx="10" fill="#263238" stroke="#263238" stroke-width="3"/>
<text x="125.0" y="478" font-family="Montserrat, Arial, sans-serif" font-size="28" font-weight="700" fill="white" text-anchor="middle" dominant-baseline="middle">Repeated</text>
<text x="125.0" y="512" font-family="Montserrat, Arial, sans-serif" font-size="28" font-weight="700" fill="white" text-anchor="middle" dominant-baseline="middle">START</text>
<text x="125.0" y="605" font-family="Montserrat, Arial, sans-serif" font-size="25" font-weight="600" fill="#6B7680" text-anchor="middle" dominant-baseline="middle"></text>
<rect x="234" y="440" width="270" height="110" rx="10" fill="#006DAF" stroke="#006DAF" stroke-width="3"/>
<text x="369.0" y="495" font-family="Montserrat, Arial, sans-serif" font-size="28" font-weight="700" fill="white" text-anchor="middle" dominant-baseline="middle">0x68 + R</text>
<text x="369.0" y="590" font-family="Montserrat, Arial, sans-serif" font-size="25" font-weight="600" fill="#6B7680" text-anchor="middle" dominant-baseline="middle">address,</text>
<text x="369.0" y="620" font-family="Montserrat, Arial, sans-serif" font-size="25" font-weight="600" fill="#6B7680" text-anchor="middle" dominant-baseline="middle">read bit 1</text>
<rect x="518" y="440" width="150" height="110" rx="10" fill="#E7F6EC" stroke="#2E9E5B" stroke-width="3"/>
<text x="593.0" y="495" font-family="Montserrat, Arial, sans-serif" font-size="28" font-weight="700" fill="#2E9E5B" text-anchor="middle" dominant-baseline="middle">ACK</text>
<text x="593.0" y="605" font-family="Montserrat, Arial, sans-serif" font-size="25" font-weight="600" fill="#6B7680" text-anchor="middle" dominant-baseline="middle"></text>
<rect x="682" y="440" width="380" height="110" rx="10" fill="#E8F4FB" stroke="#006DAF" stroke-width="3"/>
<text x="872.0" y="495" font-family="Montserrat, Arial, sans-serif" font-size="28" font-weight="700" fill="#263238" text-anchor="middle" dominant-baseline="middle">data × 14</text>
<text x="872.0" y="590" font-family="Montserrat, Arial, sans-serif" font-size="25" font-weight="600" fill="#6B7680" text-anchor="middle" dominant-baseline="middle">each followed</text>
<text x="872.0" y="620" font-family="Montserrat, Arial, sans-serif" font-size="25" font-weight="600" fill="#6B7680" text-anchor="middle" dominant-baseline="middle">by an ACK</text>
<rect x="1076" y="440" width="160" height="110" rx="10" fill="#FDF0E3" stroke="#E07B1A" stroke-width="3"/>
<text x="1156.0" y="495" font-family="Montserrat, Arial, sans-serif" font-size="28" font-weight="700" fill="#E07B1A" text-anchor="middle" dominant-baseline="middle">NACK</text>
<text x="1156.0" y="590" font-family="Montserrat, Arial, sans-serif" font-size="25" font-weight="600" fill="#6B7680" text-anchor="middle" dominant-baseline="middle">“that's</text>
<text x="1156.0" y="620" font-family="Montserrat, Arial, sans-serif" font-size="25" font-weight="600" fill="#6B7680" text-anchor="middle" dominant-baseline="middle">enough”</text>
<rect x="1250" y="440" width="170" height="110" rx="10" fill="#263238" stroke="#263238" stroke-width="3"/>
<text x="1335.0" y="495" font-family="Montserrat, Arial, sans-serif" font-size="28" font-weight="700" fill="white" text-anchor="middle" dominant-baseline="middle">STOP</text>
<text x="1335.0" y="590" font-family="Montserrat, Arial, sans-serif" font-size="25" font-weight="600" fill="#6B7680" text-anchor="middle" dominant-baseline="middle">SDA rises,</text>
<text x="1335.0" y="620" font-family="Montserrat, Arial, sans-serif" font-size="25" font-weight="600" fill="#6B7680" text-anchor="middle" dominant-baseline="middle">SCL high</text>
</svg>

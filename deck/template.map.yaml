# Slide-kind → template mapping. Edit freely; build_deck.py reads this.
# Per kind use EITHER  layout: <name>  (+ placeholder idx for title/subtitle/body/visual)
#   OR  prototype: <slide number in template>  (+ shape NAMES for title/body/visual) to clone a designed slide.
# *_box values are [left, top, width, height] in inches and override placeholders.
#
# Template = AIoT M1_ppt1-RM1.pptx (Google Slides export). Its look lives in the layouts (logo, bottom bar,
# dotted corners) and in slide-level text boxes, so every kind clones a reference slide:
#   2 = course-name card (CUSTOM_2) · 3 = centred blue statement (MAIN_POINT) · 6 = content slide (TITLE_AND_BODY:
#   grey kicker "Google Shape;268;p44", blue Montserrat 25 title text box "…156…", one big picture "…157…").
# kicker = running header, filled with the deck title. move = {shape name: box} repositions a prototype shape.
# drop = reference shapes removed after cloning
# (the prototype picture is always dropped; visuals are placed fresh into *_box).
slide_size_in: [10.0, 5.62]
keep_template_slides: false
bookends:               # template slides cloned around every deck: 1 = WELCOME, 39 = THANK YOU
  start: [1]
  end: [39]
fonts:
  title_pt: 25          # reference title text boxes: Montserrat 25 bold #006DAF (kept from the prototype run)
  body_pt: 18           # default body size (reference uses 15; 18 reads better on a projector)
  body_min_pt: 15       # used only when a slide's text would overflow its box at body_pt
  body_line_spacing: 1.2    # line height within a bullet (1.0 = single)
  body_space_after_pt: 14   # gap between bullets
  key_idea_pt: 28
  caption_pt: 12
  body_font: Muli       # exists in Google Slides (the reference was authored there)
  body_color: '434343'
  key_idea_font: Montserrat
  key_idea_color: '006DAF'
  caption_color: '666666'
  force_sizes: false    # prototype runs already carry explicit sizes; forcing would shrink title/section cards
kinds:
  title:
    prototype: 2
    title: "Google Shape;132;p27"
  section:
    prototype: 3
    title: "Google Shape;137;p28"
    move:                 # reference box sits low/right (centre 3.22 in); centre it on the 10 × 5.62 page
      "Google Shape;137;p28": [1.25, 1.91, 7.5, 1.8]
  agenda: &text
    prototype: 19
    kicker: "Google Shape;268;p44"
    title: "Google Shape;269;p44"
    drop: ["Google Shape;270;p44"]
    body_box: [0.6, 1.45, 8.8, 3.6]
  bullets: *text
  recap: *text
  key-idea:
    prototype: 19
    kicker: "Google Shape;268;p44"
    title: "Google Shape;269;p44"
    drop: ["Google Shape;270;p44"]
    body_box: [1.0, 1.7, 8.0, 2.6]
  image-text:
    prototype: 19
    kicker: "Google Shape;268;p44"
    title: "Google Shape;269;p44"
    drop: ["Google Shape;270;p44"]
    visual_box: [0.4, 1.3, 5.0, 3.85]    # picture left, text right (as reference slide 34)
    body_box: [5.6, 1.4, 4.1, 3.7]
  image-full:
    prototype: 19
    kicker: "Google Shape;268;p44"
    title: "Google Shape;269;p44"
    drop: ["Google Shape;270;p44"]
    visual_box: [0.5, 1.25, 9.0, 3.75]
    caption_box: [1.0, 5.02, 8.0, 0.35]
  two-images:
    prototype: 19
    kicker: "Google Shape;268;p44"
    title: "Google Shape;269;p44"
    drop: ["Google Shape;270;p44"]
    visual_box: [0.4, 1.3, 4.5, 3.6]
    visual2_box: [5.1, 1.3, 4.5, 3.6]
    caption_box: [1.0, 5.02, 8.0, 0.35]
